name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # bash is available on both runners (MSYS2-provided on Windows). Pin it
        # so `./aboard version` and Makefile invocations work uniformly across
        # the matrix.
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      # Windows runs the SAME target as Linux: every package here is portable
      # (an http server, a JSON document, a path resolver), and the path/port
      # code is precisely what a Windows run exists to exercise — root discovery
      # walks upward through separators, and the state file is written through a
      # same-directory temp + rename, which behaves differently on Windows.
      # The failure is ANNOTATED, not just logged.
      #
      # A run's logs need authentication to download, so on 2026-08-28 a Windows
      # failure on the release push could be seen to exist and not read: the
      # jobs API named the step and nothing named the test. Annotations are part
      # of a public repository's check run and readable without a token, so the
      # names of failing tests belong there. It costs one `tee` and says the one
      # thing the API otherwise cannot.
      - name: Test
        run: |
          set -o pipefail
          if make test 2>&1 | tee test-output.txt; then
            exit 0
          fi
          echo "::group::failing tests"
          grep -E '^(\s*--- FAIL|FAIL)' test-output.txt | head -40 || true
          echo "::endgroup::"
          # ONE annotation carrying everything, not one per line. GitHub keeps only
          # the first 10 annotations per step, and a run with ten failing tests
          # spent all ten on names and dropped every assertion line — which is the
          # half that says why. Newlines survive an annotation when encoded as %0A.
          {
            grep -E '^\s*--- FAIL' test-output.txt | head -25
            echo '---'
            grep -E '^\s+[A-Za-z0-9_]+\.go:[0-9]+:' test-output.txt | head -25
          } > failures.txt || true
          body="$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' failures.txt | awk '{printf "%s%%0A", $0}')"
          echo "::error title=go test failed (${{ matrix.os }})::${body}"
          exit 1

      - name: Keep the test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.txt
          retention-days: 7

      - name: Smoke — ./aboard version
        # Catches //go:build constraint regressions that would let a package
        # compile but produce a binary that errors on first invocation under the
        # matrix OS. The MSYS2 bash on windows-latest resolves `./aboard` to the
        # literal output of `go build -o aboard`, no .exe suffix.
        run: ./aboard version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Both gates are make targets, so CI, the pre-commit hook and a developer's
      # ladder run the SAME bingo-pinned binaries. Nothing in this file may call
      # a tool from $PATH: a runner's ambient golangci-lint is not the one this
      # repo pins, and the difference is invisible until the two disagree.
      - name: Run golangci-lint
        run: make lint

      # Belt to golangci's own gofmt/gofumpt formatters: those cover the paths
      # golangci is configured to look at, this covers the module. It is the
      # same target the hook runs.
      - name: Check formatting
        run: make fmt-check

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: make govulncheck
