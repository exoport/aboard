<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>palette</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="out">pending</div>
<script>
const css = getComputedStyle(document.documentElement);
const names = ['--bg','--surface','--sunken','--raised','--text','--muted','--dim','--line','--line-strong','--accent','--accent-ink','--mark','--agent','--edge','--focus','--drop','--status-todo','--status-doing','--status-done'];
const out = {};
for (const n of names) out[n] = css.getPropertyValue(n).trim();
out.colorScheme = css.getPropertyValue('color-scheme').trim();
document.getElementById('out').textContent = 'PALETTE ' + JSON.stringify(out);
</script>
</body>
</html>
