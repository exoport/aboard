<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mermaid probe</title>
<link rel="stylesheet" href="../app.css">
</head>
<body>
<div id="out">pending</div>
<div id="host" style="position:absolute;left:-9999px;top:0"></div>
<script src="../lib/mermaid.min.js"></script>
<script>
// Renders one minimal sample per diagram type against the vendored bundle and
// reports which actually produce an SVG. The definitive answer to "what can I
// use in the Diagram tab", rather than trusting a changelog.
const SAMPLES = {
  'flowchart':        'flowchart TD\n  A[Start] --> B{Choice}\n  B -->|yes| C[Do it]\n  B -->|no| D[Skip]',
  'graph':            'graph LR\n  A --> B --> C',
  'sequenceDiagram':  'sequenceDiagram\n  Human->>Board: drag a card\n  Board->>Server: POST\n  Server-->>Claude: file changed',
  'classDiagram':     'classDiagram\n  class Node {\n    +String id\n    +String parent\n  }\n  Node --> Node : parent',
  'stateDiagram-v2':  'stateDiagram-v2\n  [*] --> todo\n  todo --> doing\n  doing --> done\n  done --> [*]',
  'erDiagram':        'erDiagram\n  BOARD ||--o{ NODE : contains\n  NODE ||--o{ MARK : annotates',
  'journey':          'journey\n  title Using the board\n  section Draw\n    Open tab: 5: Human\n    Mark region: 4: Human',
  'gantt':            'gantt\n  title Build\n  dateFormat YYYY-MM-DD\n  section Views\n  Kanban :a1, 2026-08-01, 3d\n  DAG    :a2, after a1, 4d',
  'pie':              'pie title Lines by section\n  "strokes" : 12\n  "nodes" : 55\n  "form" : 33',
  'quadrantChart':    'quadrantChart\n  title Effort vs value\n  x-axis Low effort --> High effort\n  y-axis Low value --> High value\n  Kanban: [0.3, 0.8]\n  DAG: [0.7, 0.9]',
  // NB: the text field must be quoted if it contains punctuation such as a
  // hyphen, or the parser swallows the following line.
  'requirementDiagram': 'requirementDiagram\n\nrequirement round_trip {\n  id: 1\n  text: "edits must round-trip"\n  risk: high\n  verifymethod: test\n}',
  'gitGraph':         'gitGraph\n  commit\n  branch views\n  commit\n  checkout main\n  merge views',
  'C4Context':        'C4Context\n  title Board context\n  Person(human, "Human")\n  System(board, "Board")\n  Rel(human, board, "edits")',
  'mindmap':          'mindmap\n  root((aboard.json))\n    Kanban\n    DAG\n      reparent\n    Markup',
  'timeline':         'timeline\n  title Session\n  Research : compared 7 options\n  Build : five views\n  Restyle : FireFly Pro',
  'sankey-beta':      'sankey-beta\n\nHuman,Board,10\nBoard,Server,10\nServer,Claude,10',
  'xychart-beta':     'xychart-beta\n  title "Lines in aboard.json"\n  x-axis [before, after]\n  y-axis "lines" 0 --> 800\n  bar [741, 192]',
  'block-beta':       'block-beta\n  columns 3\n  Human Board Server\n  space:2 Claude',
  'packet-beta':      'packet-beta\n  0-7: "id"\n  8-15: "parent"\n  16-31: "payload"',
  'kanban':           'kanban\n  todo\n    [Name node n10]\n  doing\n    [Contrast pass]\n  done\n    [Dark restyle]',
  'architecture-beta':'architecture-beta\n  group repo(cloud)[repo]\n  service json(database)[board json] in repo\n  service srv(server)[server] in repo\n  json:R -- L:srv',
  'radar-beta':       'radar-beta\n  title Coverage\n  axis a["kanban"], b["dag"], c["form"]\n  curve x["now"]{80, 90, 60}',
  'treemap-beta':     'treemap-beta\n"aboard.json"\n  "nodes": 55\n  "form": 33\n  "markup": 12',
  'zenuml':           'zenuml\n  Human->Board.edit()',
};

const host = document.getElementById('host');
const results = [];
let seq = 0;

mermaid.initialize({ startOnLoad: false, theme: 'base', securityLevel: 'strict' });

(async () => {
  for (const [name, src] of Object.entries(SAMPLES)) {
    const id = 'probe-' + (seq++);
    try {
      const { svg } = await mermaid.render(id, src);
      const ok = typeof svg === 'string' && svg.includes('<svg');
      // A mermaid "error diagram" still returns an SVG, so look for its marker.
      const isErrorCard = /aria-roledescription="error"|Syntax error/i.test(svg);
      results.push({ name, ok: ok && !isErrorCard, bytes: svg ? svg.length : 0, err: isErrorCard ? 'renders error card' : null });
    } catch (e) {
      document.getElementById(id)?.remove();
      results.push({ name, ok: false, bytes: 0, err: (e && e.message ? e.message : String(e)).slice(0, 90) });
    }
  }
  document.getElementById('out').textContent = 'MERMAID ' + JSON.stringify({
    version: (mermaid.version && mermaid.version()) || 'unknown',
    results,
  });
})();
</script>
</body>
</html>
