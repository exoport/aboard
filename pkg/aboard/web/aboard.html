    // Three kinds of ping on one stream, told apart by which key is present: a
    // state change carries `origin`, a change in who is waiting carries
    // `waiters`, and the code this page should be running carries `ui`. Only the
    // first is a document reload.
    if ('ui' in payload) { onUiSignature(payload.ui); return; }
    if ('waiters' in payload) { refreshWaiters(); return; }
    if (payload.origin === CLIENT_ID) return;   // our own write echoing back (its
                                                // warnings came back in the reply)
    noteWarnings(payload.warnings, payload.checked);
    load({ announce: true, merge: true });
  });
}

// Deep links. `?tab=` has always worked; `#tab=bb71&node=bb57` addresses a node
// INSIDE a tab, which is what a reference in prose or a chat message actually
// needs — "the node called auth" becomes a click. The fragment is per-viewer
// navigation state, so it stays in the URL and never touches aboard.json.
function readTarget() {
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  // #help opens the panel — so a link can hand someone the help, and so the
  // panel can be screenshotted without a keystroke.
  if (location.hash.replace(/^#/, '').split('&').includes('help')) setTimeout(openHelp, 0);
  const query = new URLSearchParams(location.search);
  return {
    tab: hash.get('tab') || query.get('tab'),
    node: hash.get('node') || query.get('node'),
  };
}

// A renderer opts in by returning a `focus(id)` from its mount. Anything that
// does not simply lands on the right tab, which is still better than nothing.
function goToTarget({ tab, node }, { announce = false } = {}) {
  if (!tab) return;
  const match = tabs().find((t) => t.id === tab || t.key === tab || t.type === tab);
  if (!match) { if (announce) stampMeta(`no tab "${tab}"`); return; }
  activate(match.id);
  if (!node) return;
  const entry = mounted.get(match.id);
  const found = entry?.handle?.focus?.(node);
  if (found === false && announce) stampMeta(`${node} is not on this tab`);
}

const wantTab = readTarget().tab;
await load();

// SSE keeps the notify button current; the interval is the belt for ?nosse=1 and
// for a stream that dropped without the page noticing. The faster tick only
// repaints the countdown — no request, and nothing to do when nobody is waiting.
await refreshWaiters();
await showVersion();
await loadCapabilities();
setInterval(refreshWaiters, 30000);
setInterval(() => { if (waiting.length) paintPoke(); }, 15000);
goToTarget(readTarget());

// Following a link to a node on the tab you are already on must still move the
// view, so listen for hash changes rather than only reading it at load.
addEventListener('hashchange', () => goToTarget(readTarget(), { announce: true }));

// A TEST SEAM, and only when asked for. `?probe=1` hangs the document plumbing
// on window so the browser suite can drive the real merge path — load(),
// mergeOntoFresh(), the save debounce and the baseline — against a real server.
//
// The alternative was moving that plumbing into a module the harness could
// import, and it was rejected: the bug being covered here is one of TIMING
// between a fetch, a debounce and an SSE frame, and a copy of the functions
// mounted somewhere else would exercise none of that. This is the shell, running
// as the shell, with a handle on it.
//
// Nothing is exposed without the flag, and nothing here is a capability the page
// does not already have — the board has no authentication and the human's own
// console can reach all of it. It is off by default because an accidental
// dependency on a debug handle is how a seam becomes an API.
if (new URLSearchParams(location.search).get('probe') === '1') {
  window.__aboardProbe = {
    get doc() { return doc; },
    get baseline() { return baseline; },
    get saveArmed() { return saveTimer !== null; },
    get stashed() { return stashedTabs; },
    get removed() { return removedTabs; },
    snapshot, snapshotTabs, canonKey, localEdits, load, save, pushDoc, mergeOntoFresh, repaint,
    // The renderer registry itself. `init` is a FUNCTION here and a literal in
    // views/<type>.spec.json, and the two must start a new tab with the same
    // keys — markup's returned { image, caption, regions, strokes }, four keys
    // markup.js has never read, while its spec told every agent the shape was
    // { layout, images }. The check that caught that used to re-parse this block
    // with a regex and eval the match in a Node vm; exposing the object lets the
    // browser suite CALL the real function instead of reconstructing it.
    types: TYPES,
  };
  document.documentElement.dataset.probe = 'ready';
}
</script>
</body>
</html>
