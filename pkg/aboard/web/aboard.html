<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="app.css">
<!-- The URL prefix this board is served under, injected by the server from
     --base-path. Must stay on one line and byte-identical: serveShell
     replaces exactly this text, and warns loudly when it cannot find it. -->
<script>window.ABOARD_BASE = "";</script>
</head>
<body>

<!-- Per-viewer chrome, asked for in the URL: ?chrome=full | notabs | none.
     Chrome visibility belongs to the VIEWER, never to aboard.json — two viewers
     can look at one board in the same second and must disagree about chrome
     while agreeing about content. ?nosse=1 and the #tab= fragment are the same
     shape. An embedder that draws its own tab list (a VS Code panel) has no
     other way to ask: the frame is cross-origin, so it can neither inject CSS
     nor reach this DOM.

     Stamped here, in a classic script at the top of <body>, rather than in the
     module below: a module is deferred, so the strip would paint and then
     vanish. An unknown value falls back to `full` — a typo that blanks the UI
     is worse than a typo that does nothing. The rules themselves are in
     app.css, keyed off this attribute. -->
<script>
(function () {
  // A LIST, not an object keyed by value: `?chrome=constructor` would find a
  // truthy inherited property on an object literal and get stamped through.
  // Nothing breaks — no CSS rule matches it, so it renders as `full` anyway —
  // but the attribute would then say something the shell never chose.
  var want = new URLSearchParams(location.search).get('chrome');
  document.body.dataset.chrome = ['full', 'notabs', 'none'].indexOf(want) >= 0 ? want : 'full';
})();
</script>

<div class="board-head">

<div class="topbar">
  <h1>aboard</h1>
  <span class="meta" id="meta">loading…</span>
  <span class="spacer"></span>
  <span class="meta" id="save-state"></span>
  <span class="meta version-badge" id="version" title="the binary serving this board"></span>
  <!-- The acknowledgement of a press, and nothing else. The BUTTON tells the
       truth about live state and repaints itself the moment the poke changes
       the waiter count, so anything written into its label is gone in a few
       frames. This is a zero-width anchor beside it: the flash is positioned
       out of it, so it neither moves the button nor can be repainted away. -->
  <span class="poke-flash" id="poke-flash" role="status" aria-live="polite"></span>
  <button type="button" class="icon-btn poke-btn" id="poke" data-live="no" disabled>
    <span class="poke-dot" aria-hidden="true"></span>
    <span id="poke-label">no session waiting</span>
  </button>
</div>

<div class="tabstrip">
  <div class="tabs" id="tabs" role="tablist"></div>
  <button type="button" class="icon-btn tab-add" id="add-tab" title="Add a tab">+</button>
</div>

  <div class="tab-note" id="tab-note" hidden>
    <span class="tab-note-label">this tab is for</span>
    <span class="tab-note-text" id="tab-note-text"></span>
    <button type="button" class="icon-btn" id="tab-note-edit">Edit</button>
  </div>

</div><!-- /.board-head -->

<div id="views"></div>

<dialog id="help-dialog" class="sheet-dialog help-dialog">
  <div class="help-head">
    <p class="panel-head">What this board can do</p>
    <button type="button" class="icon-btn" id="help-close">Close</button>
  </div>
  <div id="help-body"></div>
</dialog>

<dialog id="new-tab-dialog" class="sheet-dialog">
  <form id="new-tab-form">
    <p class="panel-head">New tab</p>
    <label class="field">
      <span>Name</span>
      <input type="text" id="new-tab-name" required maxlength="40" placeholder="Migration plan">
    </label>
    <label class="field">
      <span>Type</span>
      <select id="new-tab-type"></select>
    </label>
    <label class="field">
      <span>What is it for? <em>(optional)</em></span>
      <textarea id="new-tab-note" rows="2" maxlength="400"
        placeholder="Context an agent cannot infer from the contents — why this tab exists, what you want done with it."></textarea>
    </label>
    <p class="hint" id="new-tab-hint"></p>
    <div class="dialog-actions">
      <button type="button" class="icon-btn" id="new-tab-cancel">Cancel</button>
      <button type="submit" class="primary-btn">Create</button>
    </div>
  </form>
</dialog>

const CLIENT_ID = (crypto.randomUUID && crypto.randomUUID()) || String(Math.random()).slice(2);

// The aboard.json layout this code understands. An open page keeps running the
// JavaScript it loaded, so when the schema moves under a page that is already
// open, the live-reload fetches a document this code cannot read. Saying so
// beats rendering an empty board and letting the user guess.
const SCHEMA_VERSION = 3;

// The renderer registry. Tabs are DATA — this maps a tab's `type` to the module
// that draws it, and says what a fresh tab of that type starts with. Adding a
// capability means adding a line here; it does not mean adding a tab.
// Gestures and keys per renderer. These now live in views/<type>.spec.json — the
// SAME declaration the binary serves at /capabilities and generates the skill's
// reference from, so the human's help panel and the agent's documentation cannot
// disagree with each other or with the code.
//
// What stays here is a fallback, used only if that fetch fails. Keeping it means a
// help panel is never empty; letting the fetch win means one edit updates both
// audiences.
let HELP = {
  dag:     { gestures: ['click to select', 'double-click to rename', 'drag to move', 'drop one node ON another to reparent', 'drag the background to pan', 'wheel to zoom', 'right-click for id, link, markdown'],
             keys: [['f', 'fit the canvas'], ['r', 're-layout (discards manual positions)']] },
  kanban:  { gestures: ['drag a card between columns', '▲▼ to reorder', 'click a title to rename', 'right-click for id, link, markdown, subtree'],
             keys: [['j / k', 'move the selection down / up'], ['h / l', 'move the selected card left / right'], ['J / K', 'reorder within the column'], ['Enter', 'rename the selected card']] },
  table:   { gestures: ['click a header to sort', 'edits save as you type', 'right-click a row to copy or duplicate it'], keys: [] },
  log:     { gestures: ['scroll up to stop following, scroll to the bottom to resume', 'type in the filter to narrow'], keys: [] },
  trace:   { gestures: ['click a dot for what that write changed', 'click an actor chip to filter'], keys: [] },
  gate:    { gestures: ['Allow, Deny, or Edit then allow', 'a reason is optional but it is what the agent learns from', 'nothing here executes — the agent that asked reads your verdict'], keys: [] },
  ui:      { gestures: ['whatever the agent described — buttons record an intent, fields write into the data model'], keys: [] },
  vote:    { gestures: ['click a number to score', 'click the same number again to clear it', 'a wide split is called out rather than averaged away'], keys: [] },
  diagram: { gestures: ['edit the source and re-render', 'hover a node for its mermaid key'], keys: [] },
  form:    { gestures: ['answer and it saves', 'Reset answers clears them'], keys: [] },
  markup:  { gestures: ['region / ellipse / pen to draw', 'move and resize a mark by its handles', 'paste (Ctrl+V) or drop an image to add one', 'note each mark'], keys: [] },
  chat:    { gestures: ['Enter sends, Shift/Alt/Ctrl+Enter for a newline', 'edit or delete your own message until a session reads it'], keys: [] },
  notes:   { gestures: ['type freely', 'Tab indents (Escape then Tab to leave)', 'Read/Edit toggle when markdown is on'], keys: [] },
  html:    { gestures: ['whatever the widget offers', 'Reload the frame, or Show source'], keys: [] },
  stack:   { gestures: ['collapse a block by its header'], keys: [] },
};

const TYPES = {
  dag:     { label: 'DAG',      mount: mountDag,     blurb: 'Nodes and parent links, laid out as a tidy tree. Drag to reparent.',
             init: () => ({ nodes: [], columns: ['todo', 'doing', 'done'] }) },
  kanban:  { label: 'Kanban',   mount: mountKanban,  blurb: 'The same nodes grouped by status. Drag between columns.',
             init: () => ({ nodes: [], columns: ['todo', 'doing', 'done'] }) },
  diagram: { label: 'Diagram',  mount: mountDiagram, blurb: 'Mermaid: flowchart, sequence, ER, gantt, chart, and 19 more.',
             init: () => ({ source: 'graph TD\n    A["Start"] --> B["Next"]' }) },
  form:    { label: 'Form',     mount: mountForm,    blurb: 'Ask for structured answers: sliders, choices, text.',
             init: () => ({ title: 'Questions', intro: '', fields: [] }) },
  markup:  { label: 'Markup',   mount: mountMarkup,  blurb: 'An image with a drawing layer. Point at part of a screenshot.',
             // The SPEC's shape, not the spike's. This returned
             // { image, caption, regions, strokes } — four keys markup.js has
             // never read — so a markup tab made in the browser started with a
             // state no renderer touches and no image, while the generated
             // reference told every agent the starting shape was
             // { layout, images }. The renderer repairs it on mount, which is
             // exactly why nobody noticed.
             init: () => ({ layout: 'stacked', images: [] }) },
  chat:    { label: 'Chat',     mount: mountChat,    blurb: 'A work channel. Agents coordinate here where you can watch and interject.',
             init: () => ({ messages: [] }) },
  notes:   { label: 'Notes',    mount: mountNotes,   blurb: 'Free text. The escape hatch for anything the other types do not fit.',
             init: () => ({ text: '' }) },
  html:    { label: 'HTML',     mount: mountHtml,    blurb: 'Arbitrary HTML/CSS/JS in a sandboxed frame — a bespoke widget. No network access.',
             init: () => ({ html: '<h2>New widget</h2>\n<p>Agent-authored HTML goes here.</p>', data: {} }) },
  stack:   { label: 'Stack',    mount: mountStack,   blurb: 'Several renderers in one tab, top to bottom — a DAG, then a form, then an image.',
             init: () => ({ blocks: [] }) },
  ui:      { label: 'UI',       mount: mountUi,      blurb: 'A layout described as data, drawn by trusted components — no iframe, no script.',
             init: () => ({ root: { type: 'card', title: 'New panel', children: [{ type: 'text', value: 'An agent describes this as a component tree.' }] }, data: {} }) },
  gate:    { label: 'Gate',     mount: mountGate,    blurb: 'An approval queue: allow, deny, or edit-then-allow, each with a reason.',
             init: () => ({ pending: [], decided: [] }) },
  vote:    { label: 'Vote',     mount: mountVote,    blurb: 'Several participants score the same options; the disagreement is visible.',
             init: () => ({ question: 'Score the options', scale: 5, options: [], ballots: {} }) },
  log:     { label: 'Log',      mount: mountLog,     blurb: 'Output you can watch. Lines live in a sidecar file, fed by aboard log <id>.',
             init: () => ({ source: '', tail: 400, follow: true }) },
  trace:   { label: 'Trace',    mount: mountTrace,   blurb: 'Who wrote what, when — one lane per actor, read from the journal.',
             init: () => ({ limit: 200 }) },
  table:   { label: 'Table',    mount: mountTable,   blurb: 'Typed rows the human edits in place: findings, files, costs, verdicts.',
             init: () => ({ columns: [{ id: 'item', label: 'Item', type: 'text' },
                                      { id: 'status', label: 'Status', type: 'select', options: ['todo', 'doing', 'done'] },
                                      { id: 'done', label: 'Done', type: 'checkbox' }], rows: [] }) },
};

const $tabs = document.getElementById('tabs');
const $views = document.getElementById('views');
const $meta = document.getElementById('meta');
const $saveState = document.getElementById('save-state');
const $addTab = document.getElementById('add-tab');
const $dialog = document.getElementById('new-tab-dialog');

let doc = null;
let activeId = null;
const mounted = new Map();   // tab id -> { root, handle, type }
let saveTimer = null;

/* ---------- document plumbing ---------- */

const tabs = () => (doc && Array.isArray(doc.tabs) ? doc.tabs : []);
const tabById = (id) => tabs().find((t) => t.id === id) || null;

// A tab may borrow another tab's state, so a kanban and a DAG can be two
// readings of one dataset. Resolve one hop; a dangling pointer falls back to
// the tab's own state so the view still gets an object.
function stateOf(tab) {
  if (tab.stateFrom) {
    const src = tabById(tab.stateFrom);
    if (src) {
      if (!src.state || typeof src.state !== 'object') src.state = {};
      return src.state;
    }
  }
  if (!tab.state || typeof tab.state !== 'object') tab.state = {};
  return tab.state;
}

// Board-wide monotonic ids: one counter, one namespace tag, never reused.
//
// Two reasons the counter is not per-container. A deleted object's id must never
// be handed out again — ids are how instructions reference things across turns,
// so a reused id silently re-points them. And a single sequence makes every id
// unique board-wide, which is the only thing that works inside a stack tab
// holding two kanbans, where the tab cannot disambiguate at all.
//
// ONE CONSTANT PREFIX, and still no TYPE prefix. These are different things and
// only the second was ever rejected. A per-kind vocabulary (node-7, tab-3) is a
// closed set in a system where an agent invents new kinds of object, so it gets
// guessed ad hoc and stops meaning anything, and it duplicates what the object's
// position already says. A single namespace tag says nothing about kind and
// cannot be guessed wrong — it exists so that an id survives being written in
// prose: "bb49" is unmistakably this board's object, where "49" is any number at
// all. That ambiguity was real, in a channel that is mostly sentences.
//
// STRINGS rather than JSON numbers, because DOM attributes and Map keys are
// strings and mixing the two invites 147 !== "147" — now moot, but the reason
// the ids were quoted in the first place.
//
// Any argument is ignored, so callers written against the older prefixed form
// keep working. Bare "49" and legacy "n49" are still READ everywhere (every
// parser uses /^[a-z]*(\d+)$/); only writes carry the tag.
const ID_PREFIX = 'bb';   // "bulletin board"

function nextId() {
  const stored = Number(doc.nextId);
  let n = Number.isFinite(stored) && stored > 0 ? Math.floor(stored) : 1;
  // Guard against a document whose counter fell behind the ids in it (a hand
  // edit, or state written before the counter existed). The server enforces the
  // same invariant; this keeps the browser correct before the round trip.
  const used = highestUsedId();
  if (used >= n) n = used + 1;
  doc.nextId = n + 1;
  return ID_PREFIX + n;
}

function highestUsedId() {
  let max = 0;
  const walk = (v) => {
    if (Array.isArray(v)) { v.forEach(walk); return; }
    if (!v || typeof v !== 'object') return;
    for (const [k, child] of Object.entries(v)) {
      if (k === 'id' && typeof child === 'string') {
        const m = /^[a-z]*(\d+)$/.exec(child);   // bare "147" and legacy "n147"
        if (m) max = Math.max(max, Number(m[1]));
        continue;
      }
      walk(child);
    }
  };
  walk(doc.tabs);
  return max;
}

function stampMeta(note) {
  const n = tabs().length;
  const dots = tabs().filter((t) => t.touched).length;
  const who = doc ? doc.lastEditedBy : '—';
  $meta.textContent = `${n} tab${n === 1 ? '' : 's'}${dots ? ` · ${dots} unread` : ''} · last edit: ${who}`;
  if (note !== undefined) $saveState.textContent = note;
}

// The document as it was when we last loaded or successfully saved. It is what
// tells "the human changed this tab" apart from "an agent changed this tab", which
// is the whole basis of recovering from a conflict.
//
// ONE CANONICAL STRING PER TAB, not a second copy of the document. It used to be
// `JSON.parse(JSON.stringify(doc))` — a deep clone of the whole board, rebuilt on
// every load, every merge and every accepted save, and then canonicalised AGAIN
// on both sides of every comparison it existed for. That is two full
// serialisations of the board to answer a per-tab yes/no, and on a big board it
// is the browser's share of the same mistake the server made: work proportional
// to the document for a question about one tab.
//
// A string also cannot alias. The clone was necessary partly BECAUSE the baseline
// held live tab objects that a view would go on to mutate in place; strings are
// immutable, so the merge can capture the server's copy and then rearrange the
// very array it captured it from.
let baseline = null;   // { rev, tabs: Map<id, canonical string> }

const snapshot = (d) => JSON.parse(JSON.stringify(d));

// "Is this the same tab" must mean the same VALUES, not the same key order, and
// plain JSON.stringify means the second. It is not a hypothetical difference:
// `aboard init` writes the example board as its authored JSON and GET
// /aboard.json serves those bytes, but the server re-marshals through its own
// structs on the first accepted write — so `note` moves from third key to last,
// every byte of meaning unchanged. On a freshly initialised board the first
// foreign write therefore made every tab the human had touched compare unequal
// to its own baseline, and the merge classified it as a COLLISION: the server's
// copy won, the human's edit went to the stash behind a notice, and their
// pending save posted the copy that had just replaced it. Any other producer can
// reorder keys too — an agent building a document by hand, a different encoder,
// a future field — so the comparison is canonicalised rather than the writers
// being asked to agree on an order they have no reason to share.
function canon(v) {
  if (Array.isArray(v)) return v.map(canon);
  if (v && typeof v === 'object') {
    const out = {};
    for (const k of Object.keys(v).sort()) out[k] = canon(v[k]);
    return out;
  }
  return v;
}
const canonKey = (v) => JSON.stringify(canon(v));

// The baseline of a document: its revision, and one canonical string per tab.
const snapshotTabs = (d) => ({
  rev: d ? d.rev : undefined,
  tabs: new Map((d && Array.isArray(d.tabs) ? d.tabs : []).map((t) => [t.id, canonKey(t)])),
});

// Tabs the human has changed locally since the baseline, and tabs they created.
function localEdits() {
  if (!baseline) return { changed: [], added: [] };
  const changed = [];
  const added = [];
  for (const tab of tabs()) {
    const before = baseline.tabs.get(tab.id);
    if (before === undefined) added.push(tab);
    else if (before !== canonKey(tab)) changed.push(tab);
  }
  return { changed, added };
}

// Conflict recovery. Compare-and-set is whole-document, so ANY concurrent write
// anywhere on the board refuses this one — and with several agents writing, that
// is not rare. Reloading was the old behaviour and it silently threw away
// whatever had just been typed; the human is the one actor whose work cannot be
// reconstructed from anywhere else, which made this the worst data loss on the
// board.
//
// So: fetch the fresh document, and re-apply only the tabs the human actually
// touched, and only where the server's copy of that tab is unchanged from the
// baseline. A tab both sides changed is a genuine collision — the server's copy
// wins (it is already committed and another actor may have acted on it) and the
// human's version is stashed, with a per-tab notice offering it back. Nothing is
// dropped without being offered first.
const stashedTabs = new Map();   // tab id -> the human's version of that tab

// Tabs the human removed HERE that the server has not accepted yet.
//
// A removal is the one local edit the merge could not represent. localEdits()
// reports the tabs that CHANGED and the tabs that were ADDED; a tab that is gone
// is neither, and `merged` is built from the server's tab list — so any reload
// landing between `doc.tabs = filter(...)` and the save it is awaiting put the
// tab straight back, permanently. The strip then showed a tab the server did not
// have and only a page reload cleared it. Found by the browser suite, which
// caught it once under `go test -shuffle=on` and then reproduced it on demand by
// holding the POST open with a route interceptor.
//
// Cleared on an accepted push: the payload is `{...doc}`, which already lacks
// these tabs, so acceptance IS the server confirming the removal. A removal that
// is never accepted stays hidden until the page is reloaded, which is the honest
// answer — it was never committed.
const removedTabs = new Set();

// Write warnings, per tab, from the most recent write that produced any.
//
// PER-VIEWER and never in the document: a warning is a fact about a WRITE, not
// content of the board, and putting it in a tab's state would mean the next write
// copies it forward as though it were still true. The record is the journal
// (`aboard journal`, and the trace tab reads it); this is the copy that reaches
// the person looking at the tab.
//
// Two ways in, because there are two audiences for the same strings. Our own
// write answers with them in its POST reply — the shell has no stderr, so this is
// the only channel it has. A FOREIGN write brings them on the SSE change frame,
// and that is the case the feature exists for: an `aboard apply` warns on a
// terminal the human is not sitting at, and until now nothing else ever said so.
const writeNotes = new Map();   // tab id -> string[]

// `checked` is the tabs the write's checks RAN over. Both halves are needed and
// only one of them is obvious: `warnings` raises a banner, and `checked` is the
// only thing that can lower one. The banner says "the last write to this tab",
// so a later write that fixed the tree has to take it down — otherwise the
// sentence outlives the mistake and the human is looking at a warning about
// something the agent has already repaired, which is the same disagreement
// between the two of them that this feature exists to end.
function noteWarnings(warnings, checked) {
  const map = warnings && typeof warnings === 'object' ? warnings : {};
  let warned = false;
  let changed = false;
  for (const [id, list] of Object.entries(map)) {
    if (!Array.isArray(list) || !list.length) continue;
    writeNotes.set(id, list.map(String));
    warned = true;
    changed = true;
  }
  for (const id of Array.isArray(checked) ? checked : []) {
    if (map[id] && map[id].length) continue;
    if (writeNotes.delete(id)) changed = true;
  }
  return { warned, changed };
}

// The banner is informational, so it is dismissible and it is LAST — the notices
// above it are a collision to resolve and a question to answer.
function warningNotice(tab) {
  const list = writeNotes.get(tab.id);
  if (!list || !list.length) return null;

  const banner = document.createElement('div');
  banner.className = 'banner banner--warning';
  banner.dataset.visible = 'yes';
  banner.dataset.notice = 'warnings';

  const body = document.createElement('div');
  body.className = 'banner-body';
  const strong = document.createElement('strong');
  strong.textContent = 'The last write to this tab set something no renderer reads.';
  body.append(strong);
  const items = document.createElement('ul');
  items.className = 'banner-list';
  for (const line of list) {
    const li = document.createElement('li');
    li.textContent = line;
    items.append(li);
  }
  body.append(items);
  banner.append(body);

  const spacer = document.createElement('span');
  spacer.className = 'spacer';
  banner.append(spacer);

  const dismiss = button('Dismiss', 'Hide this warning here; the journal keeps it');
  dismiss.addEventListener('click', () => {
    writeNotes.delete(tab.id);
    renderNotices(tab);
  });
  banner.append(dismiss);
  return banner;
}

// withoutRemoved drops those tabs from a document just read off the server.
function withoutRemoved(fresh) {
  if (!removedTabs.size || !Array.isArray(fresh.tabs)) return fresh;
  fresh.tabs = fresh.tabs.filter((t) => !removedTabs.has(t.id));
  return fresh;
}

// Returns { merged, next, collided }, or null when the fresh copy could not be
// read. `next` is the baseline of the document EXACTLY as the server has it,
// taken before any of our tabs are laid back over it — and it is a separate
// value for a reason: `merged` contains edits the server has never seen, and
// making those the baseline would classify them as "already saved" and drop them
// at the next merge, silently and with nothing stashed.
//
// `cache: 'no-cache'` and not `no-store`: revalidate every time, but let the
// browser keep the copy it has, so a reload of a board nobody has written to
// costs a 304 and no body instead of the whole document again.
async function mergeOntoFresh() {
  let fresh;
  try {
    const res = await fetch(api('/aboard.json'), { cache: 'no-cache' });
    if (!res.ok) return null;
    fresh = await res.json();
  } catch {
    return null;
  }
  if (!Array.isArray(fresh.tabs)) return null;

  // The server's copy, captured as strings BEFORE anything below rearranges
  // `fresh` — which is exactly what the whole-document clone used to buy, at the
  // price of a second copy of the board.
  const next = snapshotTabs(fresh);
  withoutRemoved(fresh);
  const { changed, added } = localEdits();
  if (!changed.length && !added.length) return { merged: fresh, next, collided: [] };

  const freshById = new Map(fresh.tabs.map((t) => [t.id, t]));
  const collided = [];

  for (const mine of changed) {
    const serverCopy = freshById.get(mine.id);
    if (!serverCopy) continue;                       // gone: a removal answered elsewhere
    if (canonKey(serverCopy) === baseline.tabs.get(mine.id)) {
      // The server has not touched this tab since we loaded it — our edit is the
      // only change to it, so it survives.
      fresh.tabs = fresh.tabs.map((t) => (t.id === mine.id ? mine : t));
    } else {
      // Never overwrite a stash entry. The FIRST thing stashed for a tab is the
      // human's own text; anything a later pass finds there is a copy the merge
      // itself adopted, and writing that over the original handed back the
      // agent's words under "Your version was kept."
      if (!stashedTabs.has(mine.id)) stashedTabs.set(mine.id, snapshot(mine));
      collided.push(mine.id);
    }
  }
  for (const mine of added) {
    if (!freshById.has(mine.id)) fresh.tabs.push(mine);
  }
  // The counter must never regress, whichever side allocated further.
  fresh.nextId = Math.max(Number(fresh.nextId) || 1, Number(doc.nextId) || 1);
  return { merged: fresh, next, collided };
}

// adopt installs a merge result: the merged document on screen, and the SERVER's
// copy as the baseline any future conflict is measured against.
//
// The baseline used to be left where it was, which made every tab the merge had
// adopted from the server look like a fresh human edit on the next conflict —
// so a second 409 stashed the agent's text as "yours" and the notice offered it
// back under the human's name.
function adopt({ merged, next }) {
  doc = merged;
  baseline = next;
  repaint();
}

async function pushDoc({ retries = 1 } = {}) {
  clearTimeout(saveTimer);
  saveTimer = null;
  // The compare-and-set base is the REVISION, not the timestamp. `updatedAt` is
  // a millisecond clock, so two writes in one millisecond produced the same base
  // and a stale one passed; `rev` is a counter the server increments per accepted
  // write. The `updatedAt` fallback is for a board whose last write predates the
  // counter — its document has no `rev` to send, and the server accepts the old
  // token only while that is true of the copy on disk.
  const base = doc.rev !== undefined && doc.rev !== null ? String(doc.rev) : (doc.updatedAt || '');
  const payload = { ...doc, __origin: CLIENT_ID, __base: base, __by: 'human' };
  let res;
  try {
    res = await fetch(api('/aboard.json'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
  } catch {
    stampMeta('offline — is the server running?');
    return false;
  }
  if (res.status === 409) {
    const result = await mergeOntoFresh();
    if (!result) { stampMeta('could not merge — press Retry'); return false; }
    const { collided } = result;
    adopt(result);
    if (collided.length) {
      stampMeta(`kept your edits · ${collided.length} tab${collided.length === 1 ? '' : 's'} collided`);
    }
    if (retries > 0) return pushDoc({ retries: retries - 1 });
    stampMeta('your edits are kept here but not saved — press Retry');
    return false;
  }
  if (!res.ok) {
    stampMeta('save failed');
    return false;
  }
  const body = await res.json().catch(() => ({}));
  // Our own write's warnings. Rendered below, once the document has been marked
  // saved — the human pressed something and it worked, and the warning is about
  // what it did, not about whether it happened.
  const { warned, changed: notesMoved } = noteWarnings(body.warnings, body.checked);
  if (body.updatedAt) doc.updatedAt = body.updatedAt;
  if (body.rev !== undefined) doc.rev = body.rev;   // the base for the next write
  doc.lastEditedBy = 'human';
  // Accepted, so every pending removal in that payload is now the server's too.
  removedTabs.clear();
  // Accepted: this is now the state both sides agree on, so it becomes the
  // baseline any future conflict is measured against.
  baseline = snapshotTabs(doc);
  stampMeta(warned ? 'saved — with warnings' : 'saved');
  if (notesMoved) for (const [id] of mounted) renderNotices(tabById(id));
  return true;
}

// Everything waiting on a debounce that has not fired yet. A view calls
// `ctx.save()` and acts on the answer — table.js flashes the cell, vote.js
// re-renders, html.js reports "saved" into the widget — so the promise has to
// settle even when the debounce it was armed on is replaced.
//
// It used to be one resolver captured inside the timeout, which meant a second
// save() cleared the first timer and STRANDED its promise for good. Rare before;
// routine after the SSE reload started re-arming the debounce, since that is the
// same 250 ms window a view's own save is sitting in — so a vote clicked just
// before an agent write never re-rendered, and nothing said why.
let saveWaiters = [];

function settleSave(result) {
  const waiting = saveWaiters;
  saveWaiters = [];
  const done = Promise.resolve(result);
  done.then((ok) => waiting.forEach((r) => r(ok)), () => waiting.forEach((r) => r(false)));
  return done;
}

function save({ immediate = false } = {}) {
  clearTimeout(saveTimer);
  saveTimer = null;
  // An immediate save carries the debounced edits with it — they are in the same
  // document — so it answers their callers too.
  if (immediate) return settleSave(pushDoc());
  return new Promise((resolve) => {
    saveWaiters.push(resolve);
    saveTimer = setTimeout(() => { saveTimer = null; settleSave(pushDoc()); }, 250);
  });
}

/* ---------- which binary is serving this ---------- */

// After a UI change the question is always "am I looking at the new build?" —
// and with a self-reloading page and an embedded UI, the honest answer comes from
// the server, not from the page. So the badge reports the BINARY: the commit it
// was built from, `+dirty` when the tree had uncommitted changes, and when the
// file was written. Version strings that a human has to remember to bump lie
// eventually; this one cannot.

const $version = document.getElementById('version');

async function showVersion() {
  try {
    const res = await fetch(api('/health'), { cache: 'no-store' });
    if (!res.ok) return;
    const info = await res.json();
    const built = info.built ? new Date(info.built) : null;
    $version.textContent = info.version || '';
    $version.title = [
      `binary: ${info.version || 'unknown'}`,
      built ? `built ${built.toLocaleString()}` : null,
      `schema v${SCHEMA_VERSION}`,
      `pid ${info.pid}`,
      info.state ? `state ${info.state}` : null,
    ].filter(Boolean).join('\n');
  } catch {
    $version.textContent = '';
  }
}

/* ---------- what a tab is FOR ---------- */

// A tab's contents say what is on it; they do not say why it exists. "Is this a
// wish list or a commitment?" is not answerable from eight kanban cards, and an
// agent that guesses wrong acts on the wrong thing. So a tab carries an optional
// note in the human's words — set when they create it, editable any time, and the
// first thing an agent should read before touching the tab.

const $tabNote = document.getElementById('tab-note');
const $tabNoteText = document.getElementById('tab-note-text');
const $tabNoteEdit = document.getElementById('tab-note-edit');

function renderTabNote() {
  const tab = tabById(activeId);
  if (!tab) { $tabNote.hidden = true; return; }
  const note = typeof tab.note === 'string' ? tab.note.trim() : '';
  $tabNote.hidden = !note;
  $tabNoteText.textContent = note;
  $tabNoteEdit.textContent = note ? 'Edit' : 'Add';
}

function editTabNote() {
  const tab = tabById(activeId);
  if (!tab) return;
  const editor = inlineEditor({
    value: typeof tab.note === 'string' ? tab.note : '',
    placeholder: 'What is this tab for? Context an agent cannot infer from its contents.',
    saveLabel: 'Save note',
    onSave: async (text) => {
      if (text) tab.note = text;
      else delete tab.note;
      restoreNoteStrip();
      await save({ immediate: true });
      flashSaved($tabNote);
    },
    onCancel: restoreNoteStrip,
  });
  $tabNote.hidden = false;
  $tabNote.replaceChildren(editor.el);
  editor.focus();
}

function restoreNoteStrip() {
  $tabNote.replaceChildren($tabNoteLabel, $tabNoteText, $tabNoteEdit);
  renderTabNote();
}

const $tabNoteLabel = $tabNote.querySelector('.tab-note-label');
$tabNoteEdit.addEventListener('click', editTabNote);

/* ---------- help, and keys for the things you repeat ---------- */

// Half of using this board well is knowing what to try — a sentence that lived
// only in a skill file I read and the human did not. So: one panel, generated
// from the same registry the renderers come from, plus keys for the gestures that
// stop being charming the twentieth time (moving a card, fitting a graph).
//
// Every binding is guarded against firing while you type. A shortcut that eats a
// keystroke inside a textarea is worse than no shortcut, and the guard has to be
// the first thing in the handler, not an afterthought.

const $help = document.getElementById('help-dialog');
const $helpBody = document.getElementById('help-body');

// One fetch at boot replaces the fallback above with what the binary actually
// declares — including any renderer whose spec landed after this page was built.
async function loadCapabilities() {
  try {
    const res = await fetch(api('/capabilities'), { cache: 'no-store' });
    if (!res.ok) return;
    const manifest = await res.json();
    if (!Array.isArray(manifest.types) || !manifest.types.length) return;
    const next = {};
    for (const spec of manifest.types) {
      next[spec.type] = {
        gestures: Array.isArray(spec.gestures) ? spec.gestures : [],
        controls: Array.isArray(spec.controls) ? spec.controls : [],
        keys: Array.isArray(spec.keys) ? spec.keys.filter((k) => Array.isArray(k) && k.length === 2) : [],
        notes: Array.isArray(spec.notes) ? spec.notes : [],
      };
    }
    HELP = next;
  } catch {
    // Keep the fallback: an empty help panel is worse than a slightly stale one.
  }
}

function typingNow() {
  const el = document.activeElement;
  if (!el) return false;
  if (el.isContentEditable) return true;
  return /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
}

function helpSection(title, rows, mono) {
  const wrap = document.createElement('section');
  wrap.className = 'help-section';
  const h = document.createElement('h3');
  h.textContent = title;
  wrap.append(h);
  const list = document.createElement('dl');
  list.className = mono ? 'help-keys' : 'help-list';
  for (const [term, desc] of rows) {
    const dt = document.createElement('dt');
    dt.textContent = term;
    const dd = document.createElement('dd');
    dd.textContent = desc;
    list.append(dt, dd);
  }
  wrap.append(list);
  return wrap;
}

function openHelp() {
  const tab = tabById(activeId);
  const type = tab ? tab.type : null;
  $helpBody.replaceChildren();

  $helpBody.append(helpSection('Anywhere', [
    ['?', 'open or close this panel'],
    ['[ / ]', 'previous / next tab'],
    ['1 … 9', 'jump to that tab'],
    ['Escape', 'close a panel or menu'],
    ['right-click', 'copy an id, a link to it, or it as markdown'],
    ['#tab=bb71&node=bb58', 'a link that opens one node, not just the tab'],
  ], true));

  if (type && HELP[type]) {
    const spec = HELP[type];
    if (spec.keys.length) {
      $helpBody.append(helpSection(`Keys — ${TYPES[type]?.label || type}`, spec.keys, true));
    }
    // Buttons first, gestures second, and they are different things now: a
    // control is declared beside its renderer and rendered FROM that declaration,
    // so this list cannot go stale. `gestures` below is what is left — pointer and
    // keyboard behaviour that no button carries and no check can verify.
    // Declared order, not sorted: it is the order they sit in the toolbar, so the
    // list reads as a walk along the tab rather than an alphabet.
    const controls = spec.controls || [];
    if (controls.length) {
      // mono:true, i.e. the .help-keys layout. Not cosmetic: .help-list gives the
      // term column 1.2ch, which is correct for the "·" bullet the gesture lists
      // use and catastrophic for a real word — "add a note" wrapped to three lines
      // and printed straight through its own description. A button label is a
      // term, so it belongs in the column that sizes to max-content, exactly like
      // the key and "This board" sections beside it.
      $helpBody.append(helpSection(`Buttons — ${TYPES[type]?.label || type}`,
        controls.map((c) => [c.label || c.id, c.doc || '']), true));
    }
    if (spec.gestures.length) {
      $helpBody.append(helpSection(`This tab — ${TYPES[type]?.label || type}`,
        spec.gestures.map((g) => ['·', g])));
    }
    if (spec.notes && spec.notes.length) {
      $helpBody.append(helpSection('Worth knowing about this type',
        spec.notes.map((n) => ['·', n])));
    }
  }

  const others = Object.keys(HELP).filter((t) => t !== type);
  const rest = document.createElement('details');
  rest.className = 'help-rest';
  const sum = document.createElement('summary');
  sum.textContent = 'Every other tab type';
  rest.append(sum);
  for (const t of others) {
    rest.append(helpSection(TYPES[t]?.label || t, HELP[t].gestures.map((g) => ['·', g])));
  }
  $helpBody.append(rest);

  $helpBody.append(helpSection('This board', [
    ['notify', 'wakes a session blocked on aboard wait — disabled when nothing is waiting'],
    ['read-only', 'that tab is maintained by an agent; nothing there is yours to rearrange'],
    ['heartbeat', 'when an agent maintains a tab, how long ago it last said anything'],
    ['this tab is for', "the tab's note: why it exists, in your words. Editable, and an agent reads it"],
    ['reload', 'the page reloads itself when its own code changes — no need to reload webviews'],
    ['version', 'which binary is serving — the commit it was built from, +dirty if uncommitted'],
  ], true));

  if (!$help.open) $help.showModal();
}

document.getElementById('help-close').addEventListener('click', () => $help.close());

document.addEventListener('keydown', (e) => {
  // Escape first, before every guard: a panel you cannot dismiss is a trap, and
  // the native dialog behaviour is not dependable inside a VS Code webview.
  if (e.key === 'Escape' && $help.open) { e.preventDefault(); $help.close(); return; }

  if (typingNow() || e.metaKey || e.ctrlKey || e.altKey) return;

  if (e.key === '?') { e.preventDefault(); $help.open ? $help.close() : openHelp(); return; }
  if ($help.open) return;   // the panel owns the keyboard while it is up

  const list = tabs();
  const at = list.findIndex((t) => t.id === activeId);

  if (e.key === '[' || e.key === ']') {
    if (!list.length) return;
    e.preventDefault();
    const next = e.key === ']' ? (at + 1) % list.length : (at - 1 + list.length) % list.length;
    activate(list[next].id);
    return;
  }

  if (/^[1-9]$/.test(e.key)) {
    const want = list[Number(e.key) - 1];
    if (want) { e.preventDefault(); activate(want.id); }
    return;
  }

  // Anything else belongs to the renderer on screen, if it wants it.
  const entry = mounted.get(activeId);
  if (entry?.handle?.onKey?.(e)) e.preventDefault();
});

/* ---------- the page reloads itself when its own code changes ---------- */

// The server hands every SSE client a signature of the UI it is serving, first
// thing on connect (see reload.go). So a `-force` restart needs nothing from us:
// the stream drops, the browser reconnects by itself, and the signature that
// comes back does not match the code this page loaded.
//
// A CSS-only change re-links the stylesheet instead of reloading, which keeps
// scroll position, selection and anything half-typed. And a reload never
// interrupts typing: if focus is in an editable, it waits for the blur — losing
// a sentence to a stylesheet edit would be a worse bug than the staleness this
// fixes.

let uiSeen = null;

function swapStylesheet(version) {
  const link = document.querySelector('link[rel="stylesheet"]');
  if (!link) { location.reload(); return; }
  const fresh = link.cloneNode();
  fresh.href = api('/app.css') + '?v=' + encodeURIComponent(version);
  fresh.addEventListener('load', () => link.remove(), { once: true });
  link.after(fresh);
}

function reloadWhenIdle() {
  const el = document.activeElement;
  const typing = el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' || el.isContentEditable);
  if (!typing) { location.reload(); return; }
  stampMeta('new code waiting — reloading when you stop typing');
  el.addEventListener('blur', () => location.reload(), { once: true });
}

function onUiSignature(sig) {
  if (!sig || typeof sig !== 'object') return;
  if (!uiSeen) { uiSeen = sig; return; }          // first frame: this is our own code
  if (sig.html !== uiSeen.html || sig.js !== uiSeen.js) { reloadWhenIdle(); return; }
  if (sig.css !== uiSeen.css) { uiSeen = sig; swapStylesheet(sig.css); }
}

/* ---------- notify waiting sessions ---------- */

// A session blocked on `aboard wait` is an open connection to this server, so
// the count below cannot go stale: if the session dies, the connection dies and
// the button greys out on its own. That is what makes it honest to claim someone
// is listening — and why the button is disabled rather than hopeful when the
// count is zero.
//
// The click is the point. An agent waiting on a guessed predicate ("the form is
// answered") wakes halfway through a thought; "I am done, go" is a better event
// than anything it could infer.

const $poke = document.getElementById('poke');
const $pokeLabel = document.getElementById('poke-label');
const $pokeFlash = document.getElementById('poke-flash');
let waiting = [];

// How long a waiter has left, from the absolute `until` it declared. Recomputed
// on a tick rather than served as a duration, so the label cannot go stale
// between polls — and so "notify agent-1 · 2m" warns you it is about to give up.
function remainingLabel(until) {
  const ms = new Date(until).getTime() - Date.now();
  if (!Number.isFinite(ms)) return '';
  if (ms <= 0) return 'expiring';
  const mins = Math.round(ms / 60000);
  if (mins < 1) return '<1m';
  if (mins < 60) return `${mins}m`;
  return `${Math.floor(mins / 60)}h${String(mins % 60).padStart(2, '0')}`;
}

// The button, and only ever live state. It took a `note` override once, which is
// how the acknowledgement of a press ended up somewhere the next repaint would
// erase it; the override is gone deliberately, so nothing can put a message here
// again. Transient messages go through flashPoke.
function paintPoke() {
  const n = waiting.length;
  $poke.disabled = n === 0;
  $poke.dataset.live = n ? 'yes' : 'no';
  if (!n) {
    $pokeLabel.textContent = 'no session waiting';
    $poke.title = 'Nothing is waiting on this board.\nA session waits with:  aboard wait --by agent-1';
    return;
  }
  // The soonest deadline is the one that matters: it is how long you have before
  // the first session gives up.
  const soonest = waiting
    .map((w) => new Date(w.until).getTime())
    .filter((t) => Number.isFinite(t))
    .sort((a, b) => a - b)[0];
  const left = soonest ? remainingLabel(new Date(soonest).toISOString()) : '';
  const who = waiting.map((w) => w.by || 'agent');
  const head = n === 1 ? `notify ${who[0]}` : `notify ${n} sessions`;
  $pokeLabel.textContent = left ? `${head} · ${left}` : head;
  $poke.title = waiting
    .map((w) => {
      const since = new Date(w.since).toLocaleTimeString();
      const gives = w.until ? `, gives up in ${remainingLabel(w.until)}` : '';
      return `${w.by || 'agent'} — waiting for ${w.for || 'poke'} since ${since}${gives}` +
             (w.note ? `\n    ${w.note}` : '');
    })
    .join('\n');
}

async function refreshWaiters() {
  try {
    const res = await fetch(api('/waiters'), { cache: 'no-store' });
    if (!res.ok) return;
    const body = await res.json();
    waiting = Array.isArray(body.waiters) ? body.waiters : [];
    paintPoke();
  } catch {
    // Offline: keep the last known state rather than claiming nobody is there.
  }
}

// The acknowledgement of the press. It used to be written into the button's own
// label, and the poke ITSELF destroyed it: releasing the waiters changes the
// waiter count, the change broadcasts on the SSE stream, the page calls
// refreshWaiters(), and the button repaints over the one piece of feedback the
// action had. Measured in test/e2e with a 15 ms polling loop that never caught it.
//
// The fix is not to suppress the repaint — that would make the button lie about
// live state for as long as the suppression lasted, and the button's whole claim
// is that somebody is genuinely listening. The confirmation moves OFF the button
// instead, into the same transient flash the inline editors use, where nothing
// that repaints the button can reach it.
function flashPoke(text) {
  // The previous flash goes first. flashSaved APPENDS, and this anchor is zero
  // width with the flash positioned absolutely out of it, so two live at once
  // would sit exactly on top of each other and neither would be readable. Easy
  // to reach on the failure path, where paintPoke() re-enables the button from
  // live state the moment the fetch rejects and a second press can land inside
  // the 1.7 s the first message has left.
  $pokeFlash.replaceChildren();
  flashSaved($pokeFlash, text);
}

$poke.addEventListener('click', async () => {
  const expected = waiting.length;
  // Disabled for the round trip, and that is live state too: the press is in
  // flight and a second one would release nothing.
  $poke.disabled = true;
  try {
    const res = await fetch(api('/poke'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ by: 'human' }),
    });
    const body = await res.json().catch(() => ({}));
    const released = Number.isFinite(Number(body.released)) ? Number(body.released) : expected;
    waiting = [];
    paintPoke();
    // Zero is reachable even though the button is disabled with nobody waiting:
    // the last waiter can time out between the repaint and the click. Saying
    // "notified 0 sessions" would read as a failure; this says what happened.
    flashPoke(released
      ? `notified ${released} session${released === 1 ? '' : 's'}`
      : 'no session was waiting');
  } catch {
    // Nothing was released, so the waiters we knew about are still the truth.
    paintPoke();
    flashPoke('notify failed');
  }
  setTimeout(refreshWaiters, 1500);
});

/* ---------- tab strip ---------- */

function buildTabs() {
  const list = tabs();
  $tabs.replaceChildren(...list.map((tab) => {
    const btn = button('', '', { className: 'tab' });
    btn.role = 'tab';
    btn.dataset.id = tab.id;
    btn.setAttribute('aria-selected', String(tab.id === activeId));

    const label = document.createElement('span');
    label.textContent = tab.name || '(unnamed)';
    btn.append(label);

    // No type chip: the name the agent chose carries the meaning, and the
    // renderer is an implementation detail. Kept as a title for hover.
    btn.title = `${tab.id} · ${tab.name || 'unnamed'} · ${TYPES[tab.type] ? TYPES[tab.type].label : tab.type}`;

    // The unread dot: an agent changed this tab and the human has not dismissed
    // it yet. Cleared by the same gesture that dismisses the banner inside.
    if (tab.touched) {
      const dot = document.createElement('span');
      dot.className = 'tab-dot';
      dot.title = `changed by ${tab.touched.by}`;
      dot.setAttribute('aria-label', 'unread changes');
      btn.append(dot);
    }
    if (tab.pendingRemoval) {
      const ask = document.createElement('span');
      ask.className = 'tab-dot tab-dot--removal';
      ask.title = `removal requested by ${tab.pendingRemoval.by}`;
      btn.append(ask);
    }

    // Right-click a tab: its address, and the ways its content can leave the
    // board. Copy leads, download follows — a webview may refuse a download, and
    // an affordance that silently does nothing is worse than none.
    btn.addEventListener('contextmenu', (e) => {
      if (e.shiftKey) return;
      const state = stateOf(tab);
      const md = tabToMarkdown(tab, state);
      const hasNodes = Array.isArray(state.nodes) && state.nodes.length > 0;
      const entry = mounted.get(tab.id);
      openContextMenu(e, [
        { head: `${tab.id} · ${tab.type}` },
        { label: 'Copy tab id', hint: tab.id, run: (ev) => copyText(tab.id, ev) },
        { label: 'Copy link to this tab', run: (ev) => copyText(referenceFor(tab.id), ev) },
        'separator',
        { label: tab.note ? 'Edit what this tab is for' : 'Say what this tab is for',
          hint: 'note', run: () => { activate(tab.id); editTabNote(); } },
        'separator',
        md && { label: 'Copy as markdown', hint: `${md.split('\n').length} lines`,
          run: (ev) => copyText(md, ev) },
        md && { label: 'Download .md', run: () => download(exportName(tab, 'md'), md, 'text/markdown') },
        hasNodes && { label: 'Download .csv', hint: `${state.nodes.length} rows`,
          run: () => download(exportName(tab, 'csv'), nodesToCSV(state), 'text/csv') },
        tab.type === 'diagram' && entry && { label: 'Download .svg', run: () => {
          const svg = diagramSVG(entry.root);
          if (svg) download(exportName(tab, 'svg'), svg, 'image/svg+xml');
          else stampMeta('render the diagram first');
        } },
      ]);
    });

    btn.addEventListener('click', () => activate(tab.id));
    btn.addEventListener('dblclick', () => renameTab(tab));
    return btn;
  }));
}

async function renameTab(tab) {
  const next = prompt('Rename tab', tab.name || '');
  if (next === null) return;
  const trimmed = next.trim();
  if (!trimmed || trimmed === tab.name) return;
  tab.name = trimmed.slice(0, 40);
  await save({ immediate: true });
  buildTabs();
}

/* ---------- per-tab notices ---------- */

// Built fresh on every activation/refresh and inserted above the view, so the
// notice always belongs to the tab you are looking at.
// Actions: a declarative button strip any tab can carry.
//
//   state.actions: [{ id, label, intent, hint? }]
//
// A click does NOT act. It appends to state.intents, and whichever session is
// listening reads it and decides — the same posture as the sandboxed html frame
// and the same one MCP-UI and A2UI settled on: a UI emits intent, an agent
// interprets it. It means you can hand back "re-run this", "ship it", "regenerate
// the diagram" without typing a prompt, and it means a stray click can never
// perform an action nobody reviewed.
//
// The honest failure is a button nothing answers, so the strip says who would
// hear it: with a session waiting, that is a fact worth showing.
function buildActions(tab, state) {
  const actions = Array.isArray(state.actions) ? state.actions.filter((a) => a && a.id && a.label) : [];
  if (!actions.length) return null;

  const strip = document.createElement('div');
  strip.className = 'action-strip';

  const label = document.createElement('span');
  label.className = 'action-label';
  label.textContent = 'agent asked for';
  strip.append(label);

  for (const action of actions) {
    const btn = button(action.label, action.hint, { className: 'icon-btn action-btn' });
    btn.addEventListener('click', async () => {
      const list = Array.isArray(state.intents) ? state.intents : (state.intents = []);
      list.push({
        id: nextId(),
        action: action.id,
        intent: action.intent || action.label,
        at: new Date().toISOString(),
        by: 'human',
      });
      btn.disabled = true;
      const ok = await save({ immediate: true });
      btn.disabled = false;
      stampMeta(ok ? `sent "${action.label}" — ${waiting.length ? 'a session is listening' : 'nothing is waiting yet'}`
                   : 'could not record that');
    });
    strip.append(btn);
  }
  return strip;
}

// A tab both sides changed at once: the server's copy is on screen and the
// human's is in the stash. Offered back explicitly rather than merged blindly,
// because only they know whether their version still makes sense next to whatever
// the agent did.
function stashNotice(tab) {
  const mine = stashedTabs.get(tab.id);
  if (!mine) return null;

  const banner = document.createElement('div');
  banner.className = 'banner banner--removal';
  banner.dataset.visible = 'yes';

  const label = document.createElement('span');
  const strong = document.createElement('strong');
  strong.textContent = 'Your edit to this tab collided.';
  label.append(strong, document.createTextNode(
    ' An agent changed it at the same moment, so what you see is theirs. Your version was kept.'));
  banner.append(label);

  const restore = button('Restore mine');
  restore.addEventListener('click', async () => {
    const at = tabs().findIndex((t) => t.id === tab.id);
    if (at >= 0) doc.tabs[at] = mine;
    stashedTabs.delete(tab.id);
    repaint();
    await save({ immediate: true });
  });

  const discard = button('Keep theirs');
  discard.addEventListener('click', () => {
    stashedTabs.delete(tab.id);
    renderNotices(tab);
  });

  banner.append(restore, discard);
  return banner;
}

function buildNotices(tab) {
  const wrap = document.createElement('div');
  wrap.className = 'notices';

  // First, because it is the only notice about work that could otherwise be lost.
  const stash = stashNotice(tab);
  if (stash) wrap.append(stash);

  if (tab.touched) {
    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.dataset.visible = 'yes';

    const who = document.createElement('strong');
    who.textContent = `${tab.touched.by} changed this tab.`;
    banner.append(who);

    if (tab.touched.note) {
      const note = document.createElement('span');
      note.textContent = tab.touched.note;
      banner.append(note);
    }
    if (tab.touched.at) {
      const when = document.createElement('span');
      when.className = 'meta';
      when.textContent = new Date(tab.touched.at).toLocaleString();
      banner.append(when);
    }

    const spacer = document.createElement('span');
    spacer.className = 'spacer';
    banner.append(spacer);

    // "Somebody changed this" is only half an answer; the other half is what it
    // said before, and the journal has held it all along with nothing in the UI
    // able to reach it. READ-ONLY on purpose: this shows the previous state and
    // prints the one command that puts it back. Restoring from a button would be
    // a write the human made without seeing the document it produces, on a board
    // where a bad write is the thing history exists to recover from.
    const preview = document.createElement('pre');
    preview.className = 'history-prev';
    preview.hidden = true;

    const before = button('What it said before', 'Show the state this tab held before that change, from the journal');
    before.addEventListener('click', async () => {
      if (!preview.hidden) { preview.hidden = true; return; }
      preview.textContent = 'reading the journal…';
      preview.hidden = false;
      try {
        const res = await fetch(api(`/history?tab=${encodeURIComponent(tab.id)}&limit=1`));
        const got = await res.json();
        const version = (got.versions || [])[0];
        // `board` is which board this history is OF, absent on the default one.
        // BOTH halves of the pipeline need it and it is easy to carry into only
        // the first: the left half reads that board's journal, the right half
        // writes whichever board IT was told about, so a half-qualified line
        // takes the right document and puts it on the wrong board. The terminal
        // listing splices the same flag the same way (history.go's nameFlag);
        // this panel prints a command too, and a command in output is a claim.
        const nameFlag = got.board ? ` --name ${got.board}` : '';
        preview.textContent = version
          ? `${version.at} · replaced by ${version.by}\n\n${JSON.stringify(version.state, null, 2)}`
            + `\n\nput it back with:  aboard history ${tab.id} --at 1${nameFlag} | aboard apply${nameFlag} --by agent-1`
          : `nothing recorded for ${tab.id}.\n${got.ends || ''}`;
      } catch (err) {
        preview.textContent = `could not read the history: ${err && err.message ? err.message : err}`;
      }
    });
    banner.append(before);

    const dismiss = button('Dismiss', 'Clear this notice and the dot on the tab');
    dismiss.addEventListener('click', async () => {
      delete tab.touched;
      // Record WHEN you looked, not just that you did. `touched` is the dot;
      // `seen.human` is the timestamp another session can compare against, so an
      // agent can tell "changed since the human last read it" from "unread".
      if (!tab.seen || typeof tab.seen !== 'object') tab.seen = {};
      tab.seen.human = new Date().toISOString();
      await save({ immediate: true });
      buildTabs();
      renderNotices(tab);
    });
    banner.append(dismiss);
    wrap.append(banner, preview);
  }

  if (tab.pendingRemoval) {
    const banner = document.createElement('div');
    banner.className = 'banner banner--removal';
    banner.dataset.visible = 'yes';

    const who = document.createElement('strong');
    who.textContent = `${tab.pendingRemoval.by} asks to remove this tab.`;
    banner.append(who);

    if (tab.pendingRemoval.reason) {
      const why = document.createElement('span');
      why.textContent = tab.pendingRemoval.reason;
      banner.append(why);
    }

    const spacer = document.createElement('span');
    spacer.className = 'spacer';
    banner.append(spacer);

    const keep = button('Keep');
    keep.addEventListener('click', async () => {
      delete tab.pendingRemoval;
      delete tab.touched;
      await save({ immediate: true });
      buildTabs();
      renderNotices(tab);
    });

    const remove = button('Remove tab', '', { className: 'icon-btn icon-btn--danger',
      onClick: () => removeTab(tab) });

    banner.append(keep, remove);
    wrap.append(banner);
  }

  const warnings = warningNotice(tab);
  if (warnings) wrap.append(warnings);

  return wrap;
}

function renderActions(tab) {
  const entry = tab && mounted.get(tab.id);
  if (!entry || !entry.actions) return;
  const strip = buildActions(tab, stateOf(tab));
  entry.actions.replaceChildren(...(strip ? [strip] : []));
}

function renderNotices(tab) {
  // A tab that is gone: every caller reaches this through tabById(), and a view
  // can still be mounted for a tab the document no longer has — a removal awaiting
  // the save that confirms it is exactly that window.
  if (!tab) return;
  const entry = mounted.get(tab.id);
  if (!entry) return;
  entry.notices.replaceChildren(buildNotices(tab));
  stampMeta();
}

async function removeTab(tab) {
  const dependents = tabs().filter((t) => t.stateFrom === tab.id);
  let msg = `Remove the tab "${tab.name}"? Its content is deleted.`;
  if (dependents.length) {
    msg += `\n\n${dependents.length} other tab(s) read this tab's data and will be emptied: ${dependents.map((t) => t.name).join(', ')}`;
  }
  if (!confirm(msg)) return;

  // A dependent tab would dangle, so give it its own copy of what it was showing.
  for (const dep of dependents) {
    dep.state = JSON.parse(JSON.stringify(stateOf(tab)));
    delete dep.stateFrom;
  }

  doc.tabs = tabs().filter((t) => t.id !== tab.id);
  // Remembered across the await below: a reload arriving while the save is in
  // flight rebuilds `doc` from the server, which still has this tab.
  removedTabs.add(tab.id);
  const entry = mounted.get(tab.id);
  if (entry) {
    entry.root.remove();
    mounted.delete(tab.id);
  }
  if (activeId === tab.id) activeId = tabs()[0] ? tabs()[0].id : null;

  await save({ immediate: true });
  buildTabs();
  if (activeId) activate(activeId);
}

/* ---------- mounting ---------- */

// Bind by ID, never by object. `load()` replaces `doc` with a freshly parsed
// graph on every external change, so a captured tab object is orphaned the
// moment another session writes — and a mounted renderer holds its ctx for the
// life of the mount. Two failures came out of that, one visible and one not:
// refresh() re-rendered the previous parse (an agent's new card never appeared
// until the page was reloaded), and any human edit made afterwards mutated a
// detached object that pushDoc's {...doc} does not serialise, so it reached the
// DOM and never the server. Resolving on every access costs a find over ~20
// tabs and makes both impossible.
function ctxFor(tabId) {
  const live = () => tabById(tabId) || { id: tabId };
  return {
    get state() { return stateOf(live()); },
    get tab() { const t = live(); return { id: t.id, name: t.name, type: t.type }; },
    save,
    nextId,
    // The renderer registry, handed to views so a tab can compose renderers
    // rather than being one. `stack` uses this; nothing else needs to.
    types: () => Object.entries(TYPES).map(([type, spec]) => ({ type, label: spec.label, blurb: spec.blurb })),
    initFor: (type) => (TYPES[type] ? TYPES[type].init() : {}),
    mountType(type, el, subCtx) {
      const spec = TYPES[type];
      if (!spec) return null;
      return spec.mount(el, subCtx) || null;
    },
    refreshOthers(exceptId) {
      for (const [id, entry] of mounted) {
        if (id !== exceptId && id !== tabId) entry.handle?.refresh?.();
      }
      stampMeta();
    },
  };
}

// Reports whether it mounted a renderer FRESH, as opposed to refreshing one that
// was already there. activate() needs the difference for the mount receipt: a
// re-sweep on a tab switch is not a mount, and counting it as one would make
// "mounted 9×" mean "the human looked nine times".
function ensureMounted(id) {
  const tab = tabById(id);
  if (!tab) return false;

  const existing = mounted.get(id);
  // A type change means a different renderer, so tear the old one down.
  if (existing && existing.type === tab.type) {
    existing.handle?.refresh?.();
    renderNotices(tab);
    return false;
  }
  if (existing) {
    // A renderer may hold a timer (a log poll, a heartbeat tick). Tearing the
    // DOM out does not stop those, so ask it to clean up first.
    try { existing.handle?.destroy?.(); } catch {}
    existing.root.remove();
    mounted.delete(id);
  }

  const root = document.createElement('section');
  root.className = 'view';
  root.dataset.view = tab.type;
  root.dataset.tab = tab.id;
  root.dataset.active = tab.id === activeId ? 'yes' : 'no';

  const notices = document.createElement('div');
  const actions = document.createElement('div');
  const body = document.createElement('div');
  root.append(notices, actions, body);
  $views.append(root);

  const entry = { root, notices, actions, body, handle: null, type: tab.type };
  mounted.set(id, entry);
  notices.replaceChildren(buildNotices(tab));
  renderActions(tab);

  const spec = TYPES[tab.type];
  if (!spec) {
    const p = document.createElement('p');
    p.className = 'hint';
    p.textContent = `No renderer for type "${tab.type}". Known types: ${Object.keys(TYPES).join(', ')}.`;
    body.append(p);
    return true;
  }

  try {
    entry.handle = spec.mount(body, ctxFor(tab.id)) || null;
  } catch (err) {
    body.replaceChildren();
    const p = document.createElement('p');
    p.className = 'hint';
    p.textContent = `${spec.label} view failed to load: ${err && err.message ? err.message : err}`;
    body.append(p);
    console.error(`[aboard] ${tab.type} mount failed`, err);
  }
  return true;
}

/* ---------- mount receipts ---------- */

// What the browser actually drew, reported back so a session can ask.
//
// `aboard apply` printing "applied" is evidence a write was ACCEPTED, not that
// anything renders — an unknown `ui` component draws a marker and an unknown
// PROP draws nothing at all — so three sessions in a row ended with "it's ready"
// followed by the human finding it wrong. This closes the loop for the half a
// machine can see: after every mount the shell posts the DECLARED control ids it
// drew, any control the renderer built that no spec declares, and the markers a
// renderer put up because it did not recognise something.
//
// Deliberately not a DOM sweep of `button[title]` against free-text `gestures` —
// that was measured on the spike at about four real gaps in twenty-three
// candidates and abandoned. Every id here is already machine-declared in
// views/<type>.spec.json.
//
// Fire-and-forget, and silent on failure: this is a REPORT about rendering, and
// a report that could break the thing it reports on would be a bad trade. It
// lands in a sidecar under .aboard/run/, never in the board document — the same
// rule that keeps selection, zoom and drafts out of it.

// Presses not yet reported, per tab. A DELTA, cleared when it is sent, because
// the server accumulates: re-sending a running total on every post would count
// every press again on every mount. Keyed by tab because a press belongs to the
// tab it happened in — a single counter would attribute a dag's Relayout to
// whichever tab was mounted next.
const pendingPresses = new Map();

function sweepReceipt(root, tab, mount) {
  const controls = new Set();
  const undeclared = new Set();
  const unknown = new Set();
  for (const el of root.querySelectorAll(`[${GESTURE_ATTR}]`)) {
    const id = el.getAttribute(GESTURE_ATTR);
    if (!id) continue;
    (el.dataset.undeclared ? undeclared : controls).add(id);
  }
  for (const el of root.querySelectorAll('[data-unknown]')) {
    if (el.dataset.unknown) unknown.add(el.dataset.unknown);
  }
  const fired = pendingPresses.get(tab.id) || new Map();
  pendingPresses.delete(tab.id);
  return {
    tab: tab.id,
    type: tab.type,
    mount: !!mount,
    controls: [...controls],
    undeclared: [...undeclared],
    unknown: [...unknown],
    fired: Object.fromEntries(fired),
  };
}

function postReceipt(root, tab, { mount = true } = {}) {
  let body;
  try { body = JSON.stringify(sweepReceipt(root, tab, mount)); } catch { return; }
  fetch(api('/rendered'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body,
    // The page may be closing when this goes out; a receipt is not worth an
    // unhandled rejection in the console of a board that is otherwise fine.
    keepalive: true,
  }).catch(() => {});
}

// A press is recorded on the way through and reported shortly after, on a
// debounce.
//
// Debounced rather than sent per click because most controls repaint the tab —
// several in a row would be several requests for one gesture — and NOT left to
// the next mount, which is what it did first: ensureMounted returns early for a
// tab that is already mounted, so a press on the tab you are looking at would
// have been reported only if you changed its type, i.e. never.
//
// Delegated on the views container and CAPTURING, so a handler that stops
// propagation — several renderers do — cannot make the press invisible.
let pressTimer = null;
$views.addEventListener('click', (ev) => {
  const el = ev.target && ev.target.closest && ev.target.closest(`[${GESTURE_ATTR}]`);
  if (!el) return;
  const id = el.getAttribute(GESTURE_ATTR);
  const view = el.closest('[data-tab]');
  if (!id || !view) return;
  const tabId = view.dataset.tab;
  if (!pendingPresses.has(tabId)) pendingPresses.set(tabId, new Map());
  const counts = pendingPresses.get(tabId);
  counts.set(id, (counts.get(id) || 0) + 1);

  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => {
    const tab = tabById(tabId);
    const entry = mounted.get(tabId);
    if (tab && entry) postReceipt(entry.root, tab, { mount: false });
  }, 400);
}, true);

// Which tab you were last on is a NICETY, and storage is not always there to
// hold it. Inside a webview the board runs as a third-party frame, where storage
// is partitioned and, in some configurations, refused outright — and a refusal
// is a thrown SecurityError, not a null. Thrown from inside activate() it took
// tab switching down with it, which is the one gesture an embedder depends on.
// These are the UI's only two localStorage call sites; guarding both turns a
// total failure into a forgotten preference. (views/ui.js reaches for
// sessionStorage to remember which panel of a `tabs` component was open, and it
// has been guarded since it was written — same reason, same shape.)
function rememberTab(id) {
  try { localStorage.setItem('aboard.tab', id); } catch {}
}

function lastTab() {
  try { return localStorage.getItem('aboard.tab'); } catch { return null; }
}

// A host that embeds the board keeps its own tab list, and the board switches
// tabs on its own — [ and ], 1-9, and whichever tab it picks on load. A sidebar
// that can only ever SEND navigation drifts the moment the human presses ], and
// a highlight that lies is worse than no highlight at all: it is the thing they
// trust to answer "where am I".
//
// '*' as the target origin, deliberately: the embedder's vscode-webview://<uuid>
// origin is not knowable in advance, and the tab id is already in this page's own
// URL, so there is nothing here to disclose. The receiver authenticates by
// comparing event.source, not origin.
//
// Nothing else travels this way. The tab list, the document and the notices are
// read from /aboard.json and /events like every other client — a second, weaker
// channel for the same data is a bug factory.
//
// It says what CHANGED, not what happened. repaint() re-activates the current
// tab at the end of every pass, and a pass runs on every foreign write arriving
// over SSE — so announcing from inside activate() unconditionally would post the
// same id again every time an agent touched the board. That is not harmless
// noise: the embedder this was built for answers each message by revealing the
// row in its tree, so an unchanged tab re-announced ten times a minute drags the
// human's sidebar back under their cursor. One id remembered here is the whole
// fix, and it makes "posted whenever the active tab changes" the true sentence
// the documentation was already writing.
let announcedTab = null;

function announceActive(id) {
  if (window.parent === window) return;
  if (id === announcedTab) return;
  announcedTab = id;
  try { parent.postMessage({ __aboard: 'active', tab: id }, '*'); } catch {}
}

function activate(id) {
  // The note belongs to the tab you are looking at, so it repaints on every
  // switch — not only on a document reload.
  setTimeout(renderTabNote, 0);
  if (!tabById(id)) return;
  activeId = id;
  rememberTab(id);
  announceActive(id);
  for (const btn of $tabs.children) {
    btn.setAttribute('aria-selected', String(btn.dataset.id === id));
  }
  for (const [tid, entry] of mounted) {
    entry.root.dataset.active = tid === id ? 'yes' : 'no';
  }
  const fresh = ensureMounted(id);

  // The receipt is posted HERE and not inside ensureMounted, so a tab that is
  // already mounted is swept again when the human comes back to it. That is not
  // belt and braces: `ui`'s `tabs` component builds only the OPEN panel, so a
  // component the human has not yet revealed is genuinely not drawn — the
  // gallery's deliberate `sparkline` marker sits in the fifth panel and no mount
  // sweep will ever see it. A re-sweep on activation reports what is on screen
  // NOW, which is the only thing a receipt was ever claiming.
  //
  // After the catch inside ensureMounted, too: a tab whose renderer threw is
  // exactly the one an agent most needs a receipt for.
  const tab = tabById(id);
  const entry = mounted.get(id);
  if (tab && entry) postReceipt(entry.root, tab, { mount: fresh });
}

/* ---------- new tab ---------- */

const $typeSelect = document.getElementById('new-tab-type');
const $nameInput = document.getElementById('new-tab-name');
const $typeHint = document.getElementById('new-tab-hint');

for (const [type, spec] of Object.entries(TYPES)) {
  const opt = document.createElement('option');
  opt.value = type;
  opt.textContent = spec.label;
  $typeSelect.append(opt);
}
const showBlurb = () => { $typeHint.textContent = TYPES[$typeSelect.value]?.blurb || ''; };
$typeSelect.addEventListener('change', showBlurb);
showBlurb();

$addTab.addEventListener('click', () => {
  $nameInput.value = '';
  showBlurb();
  $dialog.showModal();
  $nameInput.focus();
});
document.getElementById('new-tab-cancel').addEventListener('click', () => $dialog.close());

document.getElementById('new-tab-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = $nameInput.value.trim();
  const type = $typeSelect.value;
  if (!name || !TYPES[type]) return;

  const noteEl = document.getElementById('new-tab-note');
  const note = (noteEl && noteEl.value.trim()) || '';
  const tab = { id: nextId(), name: name.slice(0, 40), type, state: TYPES[type].init() };
  // Captured at creation, while the intent is fresh — this is the field an agent
  // reads to know what you wanted from the tab.
  if (note) tab.note = note.slice(0, 400);
  tabs().push(tab);
  if (noteEl) noteEl.value = '';
  $dialog.close();
  await save({ immediate: true });
  buildTabs();
  activate(tab.id);
});

/* ---------- load / live reload ---------- */

function schemaNotice(found) {
  const newer = found > SCHEMA_VERSION;
  $views.replaceChildren();
  const box = document.createElement('div');
  box.className = 'banner banner--removal';
  box.dataset.visible = 'yes';

  const strong = document.createElement('strong');
  strong.textContent = newer
    ? 'This page is running older code than the board.'
    : 'This board is in an older format than this page expects.';
  box.append(strong);

  const detail = document.createElement('span');
  detail.textContent = newer
    ? `The board is version ${found}; this page understands ${SCHEMA_VERSION}. Reload to pick up the new code.`
    : `The board is version ${found}; this page expects ${SCHEMA_VERSION}.`;
  box.append(detail);

  const spacer = document.createElement('span');
  spacer.className = 'spacer';
  box.append(spacer);

  if (newer) {
    const btn = button('Reload', '', { className: 'primary-btn', onClick: () => location.reload() });
    box.append(btn);
  }

  $views.append(box);

  const help = document.createElement('p');
  help.className = 'hint';
  help.textContent = 'In VS Code\u2019s Simple Browser, Ctrl/Cmd+R may not reach the page: '
    + 'run "Developer: Reload Webviews" from the Command Palette instead.';
  $views.append(help);
  stampMeta('');
}

// load is the FIRST read, and the reload an SSE ping asks for. The two differ,
// and conflating them cost the human whatever they had just typed: the ping path
// used to replace `doc` and reset `baseline` unconditionally, so a foreign write
// arriving inside the 250 ms save debounce swapped the document out from behind
// the textarea — and the pending save then posted the server's own copy back,
// got a 200 and flashed "Saved" over the edit it had just discarded.
//
// So a reload with a document already on screen goes through the same merge a
// 409 does, and re-arms the debounce if a save was still pending. A merge that
// cannot read the fresh copy falls back to the plain replace: being stale is
// worse than being surprised.
async function load({ announce = false, merge = false } = {}) {
  if (merge && doc) {
    const pending = saveTimer !== null;
    const result = await mergeOntoFresh();
    if (result) {
      adopt(result);
      if (result.collided.length) {
        stampMeta(`kept your edits · ${result.collided.length} tab${result.collided.length === 1 ? '' : 's'} collided`);
      } else if (announce) {
        stampMeta('board reloaded');
      }
      // The debounce was cleared by nothing here, but the save it was going to
      // make was built on the document we have just replaced. Re-arm it so the
      // edit still reaches the server, now on top of what the other writer did.
      if (pending) save();
      return undefined;
    }
  }
  const res = await fetch(api('/aboard.json'), { cache: 'no-cache' });
  doc = withoutRemoved(await res.json());
  baseline = snapshotTabs(doc);
  return repaint({ announce });
}

// Everything that puts `doc` on screen, with no fetching of its own. Split out of
// load() so a merged document can be painted as-is: re-fetching at that point is
// precisely the bug that used to discard the human's edit.
function repaint({ announce = false } = {}) {
  const version = Number(doc.version) || 1;
  if (version !== SCHEMA_VERSION) {
    for (const [, entry] of mounted) entry.root.remove();
    mounted.clear();
    $tabs.replaceChildren();
    schemaNotice(version);
    return;
  }

  if (!tabs().length) {
    $views.replaceChildren();
    const p = document.createElement('p');
    p.className = 'hint';
    p.textContent = 'No tabs yet. Use + to add one.';
    $views.append(p);
  }

  // Drop views whose tab is gone; refresh the rest.
  for (const [id, entry] of [...mounted]) {
    if (!tabById(id)) {
      entry.root.remove();
      mounted.delete(id);
    }
  }
  if (!tabById(activeId)) {
    activeId = lastTab();
    if (!tabById(activeId)) activeId = tabs()[0] ? tabs()[0].id : null;
  }

  buildTabs();
  renderTabNote();
  for (const [id, entry] of mounted) {
    entry.handle?.refresh?.();
    renderNotices(tabById(id));
    renderActions(tabById(id));
  }
  stampMeta('');
  if (activeId) activate(activeId);
  if (announce) stampMeta('board reloaded');
}

// ?nosse=1 skips the live-reload stream. The stream is a connection that never
// closes, which stops headless browsers from ever reaching network-idle — so
// this flag exists purely so the page can be smoke-tested.
if (!new URLSearchParams(location.search).has('nosse')) {
  const stream = new EventSource(api('/events'));
  stream.addEventListener('message', (e) => {
    let payload = {};
    try { payload = JSON.parse(e.data) || {}; } catch {}
